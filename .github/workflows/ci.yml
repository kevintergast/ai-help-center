# HallofHelp — CI/CD (GitHub Actions) für Next.js (OpenNext) auf Cloudflare Workers/D1.
# Übersetzt die Strategie aus docs/git-strategy.md:
#   • Push nach `development` → Staging (automatisch)
#   • Push nach `main`        → Production (manuelles Gate via Environment-Reviewer)
#   • Pull Requests           → nur Validate/Test/Build-Gate (kein Deploy)
#
# Voraussetzungen (Details: docs/ci-cd-setup.md):
#   • Repo-Secrets:  CLOUDFLARE_API_TOKEN (scoped!), CLOUDFLARE_ACCOUNT_ID
#   • GitHub-Environment `production`: Required reviewers = das manuelle Prod-Gate,
#     plus Variable PROD_GATE_CONFIGURED=true (Defense-in-Depth-Guard unten).
name: CI/CD

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# Nur überholte PR-Feedback-Runs abbrechen. Push-/Deploy-Runs (development/main) laufen
# IMMER zu Ende — sonst könnte ein zweiter Push eine laufende D1-Migration abbrechen.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------- VALIDATE (lint · typecheck · i18n) ----------
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, "i18n:check"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.task }}

  # ---------- TEST ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # ---------- BUILD (gate auf allen Events; Artefakt = exakt das, was deployt wird) ----------
  build:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec opennextjs-cloudflare build
      # Der OpenNext-Worker-Bundle ist env-unabhängig (Bindings werden erst beim Deploy
      # gewählt) → dasselbe Artefakt geht nach Staging UND Prod.
      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: open-next-build
          path: .open-next
          retention-days: 1
          include-hidden-files: true

  # ---------- STAGING (auto bei Push nach `development`) ----------
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app.dev.hallofhelp.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next
      - name: D1-Migrationen anwenden (staging)
        run: pnpm exec wrangler d1 migrations apply hallofhelp-staging --remote
      - name: Deploy (staging / Top-Level-Env)
        run: pnpm exec wrangler deploy

      # Ops-Dashboard (eigener Worker, ops/): deployt mit — idempotent und
      # schnell; ein Fehler hier bricht NICHT den Produkt-Deploy (bereits durch).
      - name: Deploy Ops-Dashboard (staging)
        run: pnpm exec wrangler deploy --config ops/wrangler.toml

      # Widget-Demo (widget-demo/): fiktive Endkunden-Website auf workers.dev —
      # EIN Worker ohne Env-Split (testet per Default die Prod-Instanz, per
      # ?host=… jede andere), deployt daher mit der Staging-Pipeline.
      - name: Deploy Widget-Demo
        run: pnpm exec wrangler deploy --config widget-demo/wrangler.toml

      # Staging darf experimentell sein: Abweichung wird berichtet, bricht aber
      # nicht (dort laufen auch Zwischenstaende ohne Release).
      - name: Laufende Version verifizieren (staging)
        continue-on-error: true
        run: node scripts/verify-deployed-version.mjs https://app.dev.hallofhelp.com

  # ---------- PRODUCTION (nur `main`, manuelles Gate) ----------
  # Das Warten auf Freigabe kommt vom GitHub-Environment `production` (Required reviewers).
  # Eine Freigabe deckt Migration → Deploy in fester Reihenfolge ab (atomar; kein Deploy ohne
  # Migration). Der Preflight bricht laut ab, falls das Gate NICHT konfiguriert oder Prod noch
  # nicht provisioniert ist — statt still/kryptisch zu scheitern.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.hallofhelp.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight — Prod-Gate & Ressourcen verifizieren
        env:
          PROD_GATE_CONFIGURED: ${{ vars.PROD_GATE_CONFIGURED }}
        run: |
          if [ "${PROD_GATE_CONFIGURED}" != "true" ]; then
            echo "::error::'production'-Environment ist nicht als Gate konfiguriert (Variable PROD_GATE_CONFIGURED != true). Required reviewers setzen — siehe docs/ci-cd-setup.md."
            exit 1
          fi
          if grep -q "FILL" wrangler.toml; then
            echo "::error::wrangler.toml enthaelt noch <FILL ...>-Platzhalter — Prod-Ressourcen (D1/KV) nicht provisioniert. Siehe docs/ci-cd-setup.md."
            exit 1
          fi
          # Versionierung (docs/versioning.md): Was nach Prod geht, braucht eine
          # echte Versionsnummer UND einen CHANGELOG-Abschnitt — sonst weiss
          # hinterher niemand, was dort laeuft.
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::error::package.json steht noch auf 0.0.0 — Release mit 'pnpm release' setzen. Siehe docs/versioning.md."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt fuer Version $VERSION. 'pnpm release' ausfuehren."
            exit 1
          fi
          echo "Release $VERSION ist dokumentiert."
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next
      - name: D1-Migrationen anwenden (production)
        run: pnpm exec wrangler d1 migrations apply hallofhelp-prod --env production --remote
      - name: Deploy (production)
        run: pnpm exec wrangler deploy --env production

      - name: Deploy Ops-Dashboard (production)
        run: pnpm exec wrangler deploy --config ops/wrangler.toml --env production

      # Ground Truth statt Vertrauen: das laufende Deployment wird gefragt, was
      # es ist — weicht es von package.json ab, bricht der Job (Teil-Deploy).
      - name: Laufende Version verifizieren (production)
        run: node scripts/verify-deployed-version.mjs https://app.hallofhelp.com

  # ---------- RELEASE-TAG (nach erfolgreichem Prod-Deploy) ----------
  # Der Tag markiert GENAU den Stand, der live gegangen ist. `contents: write`
  # gilt nur für diesen Job, nicht workflow-weit.
  #
  # WICHTIG: Fehlen dem GITHUB_TOKEN die Schreibrechte (Repo-Einstellung
  # "Workflow permissions" = read-only, für uns derzeit nicht umstellbar), dann
  # SCHEITERT der Push — und der Job bleibt trotzdem GRÜN und schreibt einen
  # Hinweis in die Zusammenfassung. Ein erfolgreicher Deploy soll nicht wegen
  # eines fehlenden Tags rot aussehen; nachgezogen wird er dann mit `pnpm tag`.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: sonst kennt der Klon die bestehenden Tags nicht.
          fetch-depth: 0
      - name: Tag aus package.json setzen (idempotent)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits — nichts zu tun."
            echo "### Release-Tag: \`$TAG\` war bereits gesetzt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          if git push origin "$TAG"; then
            echo "### Release-Tag \`$TAG\` gesetzt auf ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Release-Tag \`$TAG\` NICHT gesetzt"
              echo ""
              echo "Dem GITHUB_TOKEN fehlen die Schreibrechte (Settings → Actions →"
              echo "General → Workflow permissions). Der Deploy selbst ist erfolgreich."
              echo ""
              echo "Nachziehen mit: \`pnpm tag\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Tag konnte nicht gepusht werden — mit 'pnpm tag' nachziehen."
          fi
